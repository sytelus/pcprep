# Copy to ~/.config/pcprep/azmount.yaml, keep mode 0600, and replace only the
# non-secret resource identifiers. Managed identity avoids a plaintext account
# key. For a user-assigned identity, add the documented client/resource ID.
azstorage:
  endpoint: YOUR_ACCOUNT_NAME.blob.core.windows.net
  account-name: YOUR_ACCOUNT_NAME
  container: YOUR_CONTAINER_NAME
  type: block
  mode: msi
  virtual-directory: true
  max-results-for-list: 100

allow-other: false
read-only: true

file_cache:
  path: YOUR_HOME/.cache/blobfuse2
  cleanup-on-start: true
  allow-non-empty-temp: false
